# Desk focus proof (ourostack fork only, not for upstream).
# Proves on CI runners, never on a person's machine, that Playwright's MCP tool
# and extension work in a visible browser without taking focus, before (upstream
# main) and after (the no-focus branch), and that the headed extension tests no
# longer bring the browser forward.
name: desk focus proof

on:
  workflow_dispatch:
  push:
    branches:
      - user/arimendelow/no-focus-proof

concurrency:
  group: desk-focus-proof-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  FORCE_COLOR: 1
  UPSTREAM_SHA: c409f8c83ec04485e829809beceb722d9cf8ff38

jobs:
  proof:
    name: ${{ matrix.os }} ${{ matrix.browser }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
        browser: [chromium, msedge]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 90
    defaults:
      run:
        shell: bash
    steps:
    - uses: actions/checkout@v4
      with:
        path: after
    - uses: actions/checkout@v4
      with:
        repository: microsoft/playwright
        ref: ${{ env.UPSTREAM_SHA }}
        path: before
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Build upstream main and the branch
      run: |
        (cd before && npm ci && npm run build)
        (cd after && npm ci && npm run build)
    - name: Install Chromium
      run: cd after && npx playwright install chromium
    - name: Pick the browser
      run: |
        mkdir -p out
        case "${{ matrix.browser }}-${{ runner.os }}" in
          chromium-*) exe=$(cd after && node -e "console.log(require('./packages/playwright-core').chromium.executablePath())") ;;
          msedge-macOS) exe="/Applications/Microsoft Edge.app/Contents/MacOS/Microsoft Edge" ;;
          msedge-Windows) exe="C:\\Program Files (x86)\\Microsoft\\Edge\\Application\\msedge.exe" ;;
        esac
        echo "BROWSER_EXE=$exe" >> "$GITHUB_ENV"
        echo "Browser: $exe"
    - name: Screen capture permission (macOS)
      if: runner.os == 'macOS'
      run: |
        swiftc -O after/utils/desk-focus-proof/focus-sampler.swift -o out/focus-sampler
        out/focus-sampler --preflight | tee out/screen-capture-permission.txt
    - name: Focus proof
      continue-on-error: true
      timeout-minutes: 45
      run: |
        run() {
          label="$1-${{ runner.os }}-${{ matrix.browser }}-$3"
          node after/utils/desk-focus-proof/focus-proof.mjs --playwright "$2" --browser "$BROWSER_EXE" \
            --label "$label" --scenario "$3" --rounds 2 --out "out/proof/$label" 2>&1 | tee "out/proof-$label.log" || true
        }
        for scenario in other-app browser-front; do
          run before before $scenario
          run after after $scenario
        done
    - name: Connect page hand-back timing
      continue-on-error: true
      timeout-minutes: 15
      run: |
        mkdir -p out/connect-restore
        node after/utils/desk-focus-proof/experiments/connect-restore.mjs after "$BROWSER_EXE" \
          "out/connect-restore/${{ runner.os }}-${{ matrix.browser }}.json" 40 2>&1 | tee "out/connect-restore/${{ runner.os }}-${{ matrix.browser }}.log" || true
    - name: Headed extension tests, upstream main
      if: matrix.browser == 'chromium'
      continue-on-error: true
      working-directory: before
      run: |
        npx playwright install chromium
        node ../after/utils/desk-focus-proof/watch-command.mjs --out ../out/tests-before --label "extension-tests-before-${{ runner.os }}" -- \
          npx playwright test --config=tests/extension/playwright.config.ts --workers=1 tests/extension/tab-management.spec.ts
    - name: Headed extension tests, branch
      if: matrix.browser == 'chromium'
      continue-on-error: true
      timeout-minutes: 30
      working-directory: after
      run: |
        node utils/desk-focus-proof/watch-command.mjs --out ../out/tests-after --label "extension-tests-after-${{ runner.os }}" -- \
          npx playwright test --config=tests/extension/playwright.config.ts --workers=1
    - name: Summary
      if: always()
      run: |
        for f in out/proof/*/result.md out/tests-*/result.md; do [ -f "$f" ] && { cat "$f"; echo; } >> "$GITHUB_STEP_SUMMARY"; done; true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: desk-focus-proof-${{ runner.os }}-${{ matrix.browser }}
        path: out

  # Each upstream pull request branch on its own, with upstream's own
  # extension test setup (macOS, as upstream's extension workflow runs).
  split-branch-tests:
    name: extension tests ${{ matrix.branch }}
    strategy:
      fail-fast: false
      matrix:
        branch:
          - user/arimendelow/no-focus-1-background-tabs
          - user/arimendelow/no-focus-2-no-activate
          - user/arimendelow/no-focus-3-extension-connect
    runs-on: macos-latest
    timeout-minutes: 60
    env:
      DEBUG: pw:mcp:error
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - run: npm ci
    - run: npm run build
    - run: npx playwright install --with-deps chromium
    - run: npm run test-extension

  # The new tests of each pull request, run against the code before it: with
  # the pull request's source files taken from upstream main (and, for the
  # extension, from the version reviewed before), the tests should fail.
  red-before:
    name: new tests on ${{ matrix.name }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: PR 1 with upstream main's browserModel.ts
            branch: user/arimendelow/no-focus-1-background-tabs
            from: c409f8c83ec04485e829809beceb722d9cf8ff38
            revert: packages/playwright-core/src/tools/mcp/browserModel.ts
            spec: tests/extension/background-tabs.spec.ts
          - name: PR 2 with upstream main's context.ts
            branch: user/arimendelow/no-focus-2-no-activate
            from: c409f8c83ec04485e829809beceb722d9cf8ff38
            revert: packages/playwright-core/src/tools/backend/context.ts
            spec: tests/extension/no-activate.spec.ts
          - name: PR 3 with upstream main's extension
            branch: user/arimendelow/no-focus-3-extension-connect
            from: c409f8c83ec04485e829809beceb722d9cf8ff38
            revert: packages/extension
            spec: tests/extension/connect-in-background.spec.ts
          - name: PR 3 with the extension reviewed before (c1b1d54c3)
            branch: user/arimendelow/no-focus-3-extension-connect
            from: c1b1d54c3ef91b1f1fdf73acd9128e9a0f34136d
            revert: packages/extension
            spec: tests/extension/connect-in-background.spec.ts
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
    - uses: actions/checkout@v4
      with:
        ref: ${{ matrix.branch }}
        fetch-depth: 0
    - uses: actions/setup-node@v4
      with:
        node-version: 22
    - name: Take the source files from before
      run: |
        git fetch --no-tags origin ${{ matrix.from }} || true
        git checkout ${{ matrix.from }} -- ${{ matrix.revert }}
        git status --short
    - run: npm ci
    - run: npm run build
    - run: npx playwright install --with-deps chromium
    - name: Run the new tests
      run: |
        mkdir -p out
        npx playwright test --config=tests/extension/playwright.config.ts --retries=0 ${{ matrix.spec }} 2>&1 | tee out/red-before.log || true
    - uses: actions/upload-artifact@v4
      if: always()
      with:
        name: red-before-${{ strategy.job-index }}
        path: out
